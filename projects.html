<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Works — Portfolio</title>
    <meta name="description" content="Portfolio projects showcase" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .card-shadow {
        box-shadow: 0 6px 20px rgba(12, 18, 24, 0.06);
      }
      .soft-shadow {
        box-shadow: 0 4px 12px rgba(12, 18, 24, 0.04);
      }
      .soft-border {
        border: 1px solid rgba(15, 23, 42, 0.03);
      }
      @media (min-width: 1024px) {
        body {
          background: linear-gradient(270deg, #f4f7f9 0%, #f7fafc 100%);
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-gray-100 text-gray-700">
    <div class="max-w-3xl mx-auto p-6">
      <!-- Top navbar -->
      <div
        class="flex items-center justify-between bg-white rounded-xl card-shadow p-3 mb-6 soft-border"
      >
        <div class="flex items-center gap-3">
          <a
            href="index.html"
            class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-white transition"
            aria-label="Home"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
          </a>
          <a
            href="profile.html"
            class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-white transition"
            aria-label="Profile"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
          </a>
          <a
            href="projects.html"
            class="w-10 h-10 rounded-lg bg-white flex items-center justify-center text-gray-500 ring-1 ring-gray-200"
            aria-label="Projects"
            aria-current="page"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
          </a>
          <a
            href="products.html"
            class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-white transition"
            aria-label="Products"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
              />
            </svg>
          </a>
        </div>
        <div>
          <a
            href="hire.html"
            class="bg-black text-white px-4 py-2 rounded-lg shadow-sm hover:bg-gray-800 transition"
            >Hire Me</a
          >
        </div>
      </div>

      <!-- Main Card -->
      <div class="bg-white rounded-2xl card-shadow p-8 soft-border">
        <div class="flex items-center gap-3 mb-3">
          <span class="bg-gray-100 rounded-full w-2 h-2 inline-block"></span>
          <p class="text-sm text-gray-500">Projects</p>
        </div>

        <h1 class="text-3xl font-bold text-gray-900 mb-2">My Works</h1>
        <p class="text-gray-500 mb-8">
          Discover my portfolio, where purposeful interfaces meet captivating
          design. My work strives to enhance experiences and inspire.
        </p>

        <!-- Projects List -->
        <div id="projectsList" class="space-y-4">
          <!-- Projects will be loaded dynamically -->
        </div>
      </div>

      <div class="mt-6 text-center text-sm text-gray-400">
        Built with Tailwind CSS • Portfolio Demo
      </div>
    </div>

    <script>
      // IndexedDB helper
      function openDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open("PortfolioMediaDB", 1);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function loadMediaFromDB(projectId) {
        return new Promise(async (resolve) => {
          try {
            const db = await openDB();
            const transaction = db.transaction(["projectMedia"], "readonly");
            const store = transaction.objectStore("projectMedia");
            const request = store.get(projectId);
            request.onsuccess = () => resolve(request.result?.media || []);
            request.onerror = () => resolve([]);
          } catch (e) {
            resolve([]);
          }
        });
      }

      // Load projects from localStorage
      async function loadProjects() {
        const data = localStorage.getItem("portfolioData");
        const portfolioData = data ? JSON.parse(data) : null;

        // Default projects if no data
        const defaultProjects = [
          {
            name: "Rectangle",
            description: "Product design, Icon design",
            color: "#7c3aed",
            link: "project-detail.html",
          },
          {
            name: "Morva labs",
            description: "Visual design, Branding",
            color: "#111827",
            link: "#",
          },
          {
            name: "Simply",
            description: "Landing page, Illustration design",
            color: "#fb923c",
            link: "#",
          },
          {
            name: "Glassdoor",
            description: "Icon design, Illustration design",
            color: "#38bdf8",
            link: "#",
          },
        ];

        const projects = portfolioData?.projects || [];
        const projectsList = document.getElementById("projectsList");

        // Load media from IndexedDB for projects
        for (const project of projects) {
          if (project.hasMedia) {
            try {
              const media = await loadMediaFromDB(project.id);
              project.media = media;
            } catch (e) {
              console.error("Error loading media:", e);
            }
          }
        }

        if (projects.length === 0) {
          projectsList.innerHTML = `
            <div class="text-center py-12">
              <p class="text-gray-500">No projects available yet.</p>
            </div>
          `;
          return;
        }

        projectsList.innerHTML = projects
          .map((project, index) => {
            // Check if project has media (images or videos)
            const hasMedia = project.media && project.media.length > 0;
            const firstMedia = hasMedia ? project.media[0] : null;

            return `
          <a
            href="project-detail.html?id=${project.id}"
            class="flex items-center gap-4 bg-white p-4 rounded-lg soft-shadow hover:shadow-lg transition block"
          >
            ${
              hasMedia && firstMedia.type === "image"
                ? `
              <div class="w-20 h-20 rounded-lg overflow-hidden flex-shrink-0 bg-gray-100">
                <img src="${firstMedia.data}" alt="${project.name}" class="w-full h-full object-cover" />
              </div>
            `
                : `
              <div class="flex items-center justify-center w-12 h-12 rounded-full bg-white shadow-sm flex-shrink-0">
                <svg class="w-9 h-9" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="24" cy="24" r="22" fill="${
                    project.color || "#7c3aed"
                  }" />
                  <text x="24" y="30" text-anchor="middle" font-size="16" fill="#fff" font-family="sans-serif" font-weight="700">
                    ${project.name.charAt(0).toUpperCase()}
                  </text>
                </svg>
              </div>
            `
            }
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between">
                <div class="flex-1 min-w-0">
                  <h4 class="font-semibold truncate">${project.name}</h4>
                  <p class="text-sm text-gray-400">${
                    project.description || "Project description"
                  }</p>
                </div>
                <div class="text-gray-300">
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7" />
                  </svg>
                </div>
              </div>
            </div>
          </a>
        `;
          })
          .join("");
      }

      // Load on page load
      loadProjects();
    </script>
  </body>
</html>
