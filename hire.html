<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hire Me — Portfolio</title>
    <meta name="description" content="Contact and hire Brian Do" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .card-shadow {
        box-shadow: 0 6px 20px rgba(12, 18, 24, 0.06);
      }
      .soft-shadow {
        box-shadow: 0 4px 12px rgba(12, 18, 24, 0.04);
      }
      .soft-border {
        border: 1px solid rgba(15, 23, 42, 0.03);
      }
      @media (min-width: 1024px) {
        body {
          background: linear-gradient(270deg, #f4f7f9 0%, #f7fafc 100%);
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-gray-100 text-gray-700">
    <div class="max-w-3xl mx-auto p-6">
      <!-- Top navbar -->
      <div
        class="flex items-center justify-between bg-white rounded-xl card-shadow p-3 mb-6 soft-border"
      >
        <div class="flex items-center gap-3">
          <a
            href="index.html"
            class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-white transition"
            aria-label="Home"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
          </a>
          <a
            href="profile.html"
            class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-white transition"
            aria-label="Profile"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
          </a>
          <a
            href="projects.html"
            class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-white transition"
            aria-label="Projects"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
          </a>
          <a
            href="products.html"
            class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-white transition"
            aria-label="Products"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
              />
            </svg>
          </a>
        </div>
        <div>
          <a
            href="hire.html"
            class="bg-black text-white px-4 py-2 rounded-lg shadow-sm"
            aria-current="page"
            >Hire Me</a
          >
        </div>
      </div>

      <!-- Main Card -->
      <div class="bg-white rounded-2xl card-shadow p-8 soft-border">
        <div class="flex items-center justify-between mb-6">
          <div class="flex items-center gap-3">
            <span class="bg-gray-100 rounded-full w-2 h-2 inline-block"></span>
            <p class="text-sm text-gray-500">Hire Me</p>
          </div>
          <span
            class="text-xs text-green-700 bg-green-100 px-3 py-1 rounded-full"
            >AVAILABLE FOR WORK</span
          >
        </div>

        <h1 class="text-3xl font-bold text-gray-900 mb-2">Design Inquiry</h1>
        <p class="text-gray-500 mb-8">
          Got an idea and need design help? Reach out now
        </p>

        <!-- Contact Form -->
        <form class="space-y-4 mb-8">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input
              type="text"
              placeholder="Name"
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-300 transition"
            />
            <input
              type="email"
              placeholder="Email"
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-300 transition"
            />
          </div>
          <textarea
            placeholder="Message"
            rows="6"
            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-300 transition resize-none"
          ></textarea>
          <button
            type="submit"
            class="w-full bg-gray-900 text-white py-3 rounded-lg hover:bg-gray-800 transition shadow-sm font-medium"
          >
            Submit Inquiry
          </button>
        </form>

        <!-- Follow Me Section -->
        <div class="bg-gray-50 rounded-lg p-6 soft-border">
          <div class="flex items-center gap-3 mb-4">
            <span class="bg-gray-200 rounded-full w-2 h-2 inline-block"></span>
            <h3 class="font-semibold">Follow Me</h3>
          </div>

          <div class="flex items-center gap-3">
            <a
              href="#"
              class="w-10 h-10 rounded-lg bg-white flex items-center justify-center text-gray-600 hover:bg-gray-100 transition soft-shadow"
              aria-label="Twitter/X"
            >

                <path

                />
              </svg>
            </a>
            <a
              href="#"
              class="w-10 h-10 rounded-lg bg-white flex items-center justify-center text-gray-600 hover:bg-gray-100 transition soft-shadow"
              aria-label="Instagram"
            >

                />

            </a>
            <a
              href="#"
              class="w-10 h-10 rounded-lg bg-white flex items-center justify-center text-gray-600 hover:bg-gray-100 transition soft-shadow"
              aria-label="Dribbble"

                <path
                  d="M12 0c-6.628 0-12 5.373-12 12s5.372 12 12 12 12-5.373 12-12-5.372-12-12-12zm9.885 11.441c-2.575-.422-4.943-.445-7.103-.073-.244-.563-.497-1.125-.767-1.68 2.31-1 4.165-2.358 5.548-4.082 1.35 1.594 2.197 3.619 2.322 5.835zm-3.842-7.282c-1.205 1.554-2.868 2.783-4.986 3.68-1.016-1.861-2.178-3.676-3.488-5.438.779-.197 1.591-.314 2.431-.314 2.275 0 4.368.779 6.043 2.072zm-10.516-.993c1.331 1.742 2.511 3.538 3.537 5.381-2.43.715-5.331 1.082-8.684 1.105.692-2.835 2.601-5.193 5.147-6.486zm-5.44 8.834l.013-.256c3.849-.005 7.169-.448 9.95-1.322.233.475.456.952.67 1.432-3.38 1.057-6.165 3.222-8.337 6.48-1.432-1.719-2.296-3.927-2.296-6.334zm3.829 7.81c1.969-3.088 4.482-5.098 7.598-6.027.928 2.42 1.609 4.91 2.043 7.46-3.349 1.291-7.344.673-9.641-1.433zm11.586.43c-.438-2.353-1.08-4.653-1.92-6.897 1.876-.265 3.94-.196 6.199.196-.437 2.786-2.028 5.192-4.279 6.701z"

            <a

                <path
                  d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
                />

            </a>
          </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
          <p class="text-sm text-gray-400">
            © 2023 Subtle Folio – Framer Template
          </p>
        </div>
      </div>

      <div class="mt-6 text-center text-sm text-gray-400">

</html>
