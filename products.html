<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Products — Portfolio</title>
    <meta name="description" content="Digital products showcase" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .card-shadow {
        box-shadow: 0 6px 20px rgba(12, 18, 24, 0.06);
      }
      .soft-shadow {
        box-shadow: 0 4px 12px rgba(12, 18, 24, 0.04);
      }
      .soft-border {
        border: 1px solid rgba(15, 23, 42, 0.03);
      }
      @media (min-width: 1024px) {
        body {
          background: linear-gradient(270deg, #f4f7f9 0%, #f7fafc 100%);
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-gray-100 text-gray-700">
    <div class="max-w-3xl mx-auto p-6">
      <!-- Top navbar -->
      <div
        class="flex items-center justify-between bg-white rounded-xl card-shadow p-3 mb-6 soft-border"
      >
        <div class="flex items-center gap-3">
          <a
            href="index.html"
            class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-white transition"
            aria-label="Home"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
          </a>
          <a
            href="profile.html"
            class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-white transition"
            aria-label="Profile"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
          </a>
          <a
            href="projects.html"
            class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-white transition"
            aria-label="Projects"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
          </a>
          <a
            href="products.html"
            class="w-10 h-10 rounded-lg bg-white flex items-center justify-center text-gray-500 ring-1 ring-gray-200"
            aria-label="Products"
            aria-current="page"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
              />
            </svg>
          </a>
        </div>
        <div>
          <a
            href="hire.html"
            class="bg-black text-white px-4 py-2 rounded-lg shadow-sm hover:bg-gray-800 transition"
            >Hire Me</a
          >
        </div>
      </div>

      <!-- Main Card -->
      <div class="bg-white rounded-2xl card-shadow p-8 soft-border">
        <div class="flex items-center gap-3 mb-3">
          <span class="bg-gray-100 rounded-full w-2 h-2 inline-block"></span>
          <p class="text-sm text-gray-500">Products</p>
        </div>

        <h1 class="text-3xl font-bold text-gray-900 mb-2">
          Explore My Products
        </h1>
        <p class="text-gray-500 mb-8">
          Some of the digital products that I worked on as side projects,
          explore and try it now
        </p>

        <!-- Products Section -->
        <div class="bg-gray-50 rounded-lg p-4 soft-border mb-8">
          <div class="flex items-center gap-3 mb-4">
            <span class="bg-gray-200 rounded-full w-2 h-2 inline-block"></span>
            <h3 class="font-semibold">Products</h3>
          </div>

          <div id="productsList" class="space-y-4">
            <!-- Products will be loaded dynamically -->
          </div>
        </div>

        <!-- CTA Section -->
        <div class="text-center py-8">
          <h2 class="text-2xl font-bold text-gray-900 mb-4">
            Let's work together.
          </h2>
        </div>
      </div>

      <div class="mt-6 text-center text-sm text-gray-400">
        Built with Tailwind CSS • Portfolio Demo
      </div>
    </div>

    <script>
      // Load products from localStorage
      function loadProducts() {
        const data = localStorage.getItem("portfolioData");
        const portfolioData = data ? JSON.parse(data) : null;

        // Default products if no data
        const defaultProducts = [
          {
            name: "Goven",
            tag: "FRAMER TEMPLATE",
            color: "#6366f1",
            link: "#",
          },
          {
            name: "Upshift",
            tag: "WEB DESIGN COLLECTIONS",
            color: "#84cc16",
            link: "#",
          },
          {
            name: "Subtle Folio",
            tag: "FRAMER TEMPLATE",
            color: "#71717a",
            link: "#",
          },
        ];

        const products = portfolioData?.products || [];
        const productsList = document.getElementById("productsList");

        if (products.length === 0) {
          productsList.innerHTML = `
            <div class="text-center py-12">
              <p class="text-gray-500">No products available yet.</p>
            </div>
          `;
          return;
        }

        productsList.innerHTML = products
          .map(
            (product) => `
          <a
            href="${product.link || "#"}"
            target="_blank"
            class="flex items-center justify-between bg-white p-4 rounded-lg soft-shadow hover:shadow-lg transition block"
          >
            <div class="flex items-center gap-4">
              <div class="flex items-center justify-center w-12 h-12 rounded-full bg-white shadow-sm">
                <svg class="w-8 h-8" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="24" cy="24" r="22" fill="${
                    product.color || "#6366f1"
                  }" />
                  <text x="24" y="30" text-anchor="middle" font-size="16" fill="#fff" font-family="sans-serif" font-weight="700">
                    ${product.name.charAt(0).toUpperCase()}
                  </text>
                </svg>
              </div>
              <div>
                <h4 class="font-semibold">${product.name}</h4>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full">${
                product.tag || "PRODUCT"
              }</span>
              <svg class="w-5 h-5 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
              </svg>
            </div>
          </a>
        `
          )
          .join("");
      }

      // Load on page load
      loadProducts();
    </script>
  </body>
</html>
