<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile — Portfolio</title>
    <meta name="description" content="Portfolio profile page" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .card-shadow {
        box-shadow: 0 6px 20px rgba(12, 18, 24, 0.06);
      }
      .soft-shadow {
        box-shadow: 0 4px 12px rgba(12, 18, 24, 0.04);
      }
      .ring-outer {
        box-shadow: 0 0 0 10px rgba(0, 0, 0, 0.04),
          0 0 0 22px rgba(255, 255, 255, 0.5);
        border-radius: 9999px;
      }
      .soft-border {
        border: 1px solid rgba(15, 23, 42, 0.03);
      }
      @media (min-width: 1024px) {
        body {
          background: linear-gradient(270deg, #f4f7f9 0%, #f7fafc 100%);
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-gray-100 text-gray-700">
    <div class="max-w-3xl mx-auto p-6">
      <!-- Top navbar -->
      <div
        class="flex items-center justify-between bg-white rounded-xl card-shadow p-3 mb-6 soft-border"
      >
        <div class="flex items-center gap-3">
          <a
            href="index.html"
            class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-white transition"
            aria-label="Home"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
          </a>
          <a
            href="profile.html"
            class="w-10 h-10 rounded-lg bg-white flex items-center justify-center text-gray-500 ring-1 ring-gray-200"
            aria-label="Profile"
            aria-current="page"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
          </a>
          <a
            href="projects.html"
            class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-white transition"
            aria-label="Projects"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
          </a>
          <a
            href="products.html"
            class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 hover:bg-white transition"
            aria-label="Products"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
              />
            </svg>
          </a>
        </div>
        <div>
          <a
            href="hire.html"
            class="bg-black text-white px-4 py-2 rounded-lg shadow-sm hover:bg-gray-800 transition"
          >
            Hire Me
          </a>
        </div>
      </div>

      <!-- Main Card -->
      <div class="bg-white rounded-2xl card-shadow p-8 soft-border">
        <div class="flex gap-6 items-start">
          <div class="flex-1">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-3">
                <span
                  class="bg-gray-100 rounded-full w-2 h-2 inline-block"
                ></span>
                <p id="jobTitle" class="text-sm text-gray-500">Your Title</p>
              </div>
              <span
                id="availabilityBadge"
                class="text-xs text-green-700 bg-green-100 px-3 py-1 rounded-full"
                >AVAILABLE FOR WORK</span
              >
            </div>

            <h1 id="fullName" class="text-3xl font-bold text-gray-900 mb-2">
              Your Name
            </h1>
            <p id="bio" class="text-gray-500 mb-4">
              Your bio description here. Tell people about yourself.
            </p>

            <div class="flex items-center gap-3">
              <a
                href="hire.html"
                class="bg-gray-900 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:shadow-md transition"
              >
                <svg
                  class="w-4 h-4 opacity-70"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                    d="M5 12h14M12 5v14"
                  />
                </svg>
                <span>Hire Me</span>
              </a>
              <button
                id="copyEmailBtn"
                class="bg-white border border-gray-200 px-4 py-2 rounded-lg hover:bg-gray-50 transition"
              >
                Copy Email
              </button>
            </div>
          </div>

          <div class="w-40 h-40 relative">
            <div
              class="rounded-full bg-white ring-8 ring-white ring-outer border-2 border-white absolute inset-0 flex items-center justify-center"
            >
              <img
                id="avatarImg"
                src="https://placehold.co/140x140/eee/aaa.png?text=Avatar"
                alt="avatar"
                class="w-28 h-28 rounded-full object-cover"
              />
            </div>
          </div>
        </div>

        <!-- About Section -->
        <div class="mt-8 pt-8 border-t border-gray-100">
          <h3 class="font-semibold mb-3">About Me</h3>
          <div id="aboutContent" class="text-gray-600 leading-relaxed">
            <p>Add more details about yourself in the admin panel.</p>
          </div>
        </div>
      </div>

      <div class="mt-6 text-center text-sm text-gray-400">
        Built with Tailwind CSS •
        <a href="admin-panel.html" class="hover:text-gray-600">Edit Profile</a>
      </div>
    </div>

    <script>
      // Load profile from localStorage
      function loadProfile() {
        const saved = localStorage.getItem("portfolioData");
        if (!saved) return;

        const data = JSON.parse(saved);
        const profile = data.profile;

        // Update personal info
        if (profile.fullName) {
          document.getElementById("fullName").textContent = profile.fullName;
          document.title = `${profile.fullName} — Profile`;
        }
        if (profile.jobTitle) {
          document.getElementById("jobTitle").textContent = profile.jobTitle;
        }
        if (profile.bio) {
          document.getElementById("bio").textContent = profile.bio;
        }

        // Update avatar
        if (profile.avatarUrl) {
          document.getElementById("avatarImg").src = profile.avatarUrl;
        }

        // Update availability badge
        const badge = document.getElementById("availabilityBadge");
        if (profile.availableForWork) {
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }

        // Update copy email button
        if (profile.email) {
          const copyBtn = document.getElementById("copyEmailBtn");
          copyBtn.onclick = function () {
            navigator.clipboard.writeText(profile.email);
            copyBtn.textContent = "Copied!";
            setTimeout(() => {
              copyBtn.textContent = "Copy Email";
            }, 2000);
          };
        }
      }

      // Initialize
      loadProfile();
    </script>
  </body>
</html>
